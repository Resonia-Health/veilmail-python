[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veilmail"
version = "0.1.0"
description = "Official Python SDK for Veil Mail — secure email with built-in PII protection"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Resonia Health", email = "support@veilmail.xyz" },
]
keywords = ["email", "veilmail", "sdk", "transactional-email"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.21",
    "mypy>=1.0",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://veilmail.xyz"
Documentation = "https://veilmail.xyz/docs/sdk"
Repository = "https://github.com/Resonia-Health/veilmail-python"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.9"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
